                extend: {
                    colors: {
                        'dd-dark': '#0f172a',
                        'dd-card': '#1e293b',
                        'dd-red': '#ef4444',
                        'dd-yellow': '#f59e0b',
                        'dd-green': '#10b981',

            display: none;
        }

            scrollbar-width: none;
        }

        }

        .avatar-fallback {

        // --- HELPER FUNCTION FOR IMAGE FALLBACKS ---
        function handleImgError(imgElement, name) {
            imgElement.style.display = 'none';
            // Get initials (first letter of first 2 words)
            let initials = name.split(' ').slice(0, 2).map(w => w.charAt(0)).join('').toUpperCase();
            if(!initials || initials.length === 0) initials = "??";
            
            let parent = imgElement.parentElement;
            if(parent) {
                // Remove existing fallbacks if any
                const existing = parent.querySelector('.avatar-fallback');
                if(existing) existing.remove();
                
                let fallback = document.createElement('div');
                fallback.className = 'w-full h-full avatar-fallback text-lg font-bold shadow-inner';
                fallback.innerText = initials;
                parent.appendChild(fallback);
                parent.style.background = 'transparent';
                parent.style.padding = '0';
                parent.style.border = 'none';
            }
        }

            telecom: ["קריסת מתג רשת ראשי (Core Switch)", "שגיאת ניתוב כתובות (DNS Failure)"],
            ai: ["חריגה ממכסת משאבי ענן (Capacity Limit)", "כשל במנגנון חלוקת עומסים (Load Balancer)"],
            social: ["קריסת שרתי סנכרון (WebSockets)", "באג בשליפת נתונים (Cache Failure)", "קריסת רכיב ההתחברות (OAuth)"],
            shopping: ["קריסת מסד נתוני עגלות קניות", "שגיאת רשת הפצת תוכן (CDN Failure)"],
            gaming: ["חוסר יציבות בשרתי מולטיפלייר", "קריסת שרתי התחברות (Login Servers)"],
            custom: ["Time Out: אין מענה מהשרת (Ping Failed)", "הפורט הדרוש חסום (Connection Refused)", "נפילת שרת ווב מקומי (Local HTTP Server Down)", "שגיאת רזולוציית רשת (Local DNS Error)"]
        };

        function assignStatuses() {
            servicesData.forEach(service => {
                let hash = service.name.length + service.category.length;
                let random = Math.random();
                
                if (!service.isCustom) {
                    if (service.id === 'whatsapp' || service.id === 'post' || service.id === 'discord' || service.id === 'youtube') {
                        service.status = 'down'; service.statusText = 'תקלה נרחבת'; service.statusColor = 'red';
                    } else if (random > 0.85 || service.id === 'bezeq' || service.id === 'wolt' || service.id === 'poalim') {
                        service.status = 'warning'; service.statusText = 'תקלות חלקיות'; service.statusColor = 'yellow';
                    } else {
                        service.status = 'ok'; service.statusText = 'תקין'; service.statusColor = 'green';
                    }

                    service.history = [];
                    let baseLevel = service.status === 'ok' ? 2 : (service.status === 'warning' ? 15 : 40);
                    for(let i=0; i<24; i++) {
                        let val = baseLevel + Math.floor(Math.random() * (baseLevel/2));
                        if (service.status === 'down' && i > 18) val += (Math.random() * 50 + 20);
                        if (service.status === 'warning' && i > 20) val += 15;
                        service.history.push(val);
                    }
                    
                    const issues = {
                        israel: ["אתר אינטרנט / התחברות", "אזור אישי", "מוקד שירות"],
                        finance: ["העברת כספים", "התחברות לחשבון", "אפליקציה בנייד"],
                        telecom: ["אינטרנט ביתי (סיבים)", "רשת סלולרית", "קליטה"],
                        ai: ["שרתי API", "זמן תגובה", "התחברות"],
                        social: ["שליחת הודעות", "טעינת פיד", "אפליקציה"],
                        shopping: ["סליקה / תשלום", "התחברות לאתר", "מעקב הזמנות"],
                        gaming: ["חיבור לשרת משחק", "התחברות לשירות", "סטרימינג וידאו"]
                    };
                    let issueList = issues[service.category] || issues['israel'];
                    service.primaryIssue = issueList[hash % issueList.length];

                    if (service.status !== 'ok') {
                        if (service.isGlobal) service.impactLocation = globalLocations[hash % globalLocations.length];
                        else service.impactLocation = israelLocations[hash % israelLocations.length];
                        
                        let causesList = technicalRootCauses[service.category] || technicalRootCauses['israel'];
                        if(service.id === 'youtube') service.rootCause = "קריסת רשת הפצת וידאו (Video CDN Failure)";
                        else if(service.id === 'whatsapp') service.rootCause = "כשל בשרתי ה-WebSockets (סנכרון הודעות חי)";
                        else service.rootCause = causesList[Math.floor(Math.random() * causesList.length)];
                    } else {
                        service.impactLocation = null;
                        service.rootCause = null;
                    }
                }
            });
        }

        assignStatuses();

        function renderServices(filter = 'all', searchQuery = '') {
            const grid = document.getElementById('servicesGrid');
            grid.innerHTML = '';
            
            let filtered = servicesData;
            
            if (filter === 'down') {
                filtered = filtered.filter(s => s.status === 'down' || s.status === 'warning');
            } else if (filter !== 'all') {
                filtered = filtered.filter(s => s.category === filter);
            }

            if (searchQuery) {
                filtered = filtered.filter(s => s.name.toLowerCase().includes(searchQuery.toLowerCase()) || (s.domain && s.domain.includes(searchQuery.toLowerCase())));
                
                const addContainer = document.getElementById('addServiceContainer');
                if (filtered.length === 0 && searchQuery.length > 1) {
                    addContainer.classList.remove('hidden');
                    document.getElementById('customServerName').value = searchQuery; // pre-fill
                } else {
                    addContainer.classList.add('hidden');
                }
            } else {
                document.getElementById('addServiceContainer').classList.add('hidden');
            }

            filtered.sort((a,b) => {
                const score = { 'down': 2, 'warning': 1, 'ok': 0 };
                return score[b.status] - score[a.status];
            });

            filtered.forEach(service => {
                const colorMap = {
                    'ok': 'text-emerald-500 bg-emerald-500/10 border-emerald-500/20',
                    'warning': 'text-amber-500 bg-amber-500/10 border-amber-500/20',
                    'down': 'text-red-500 bg-red-500/10 border-red-500/20'
                };
                
                const dotColorMap = {
                    'ok': 'bg-emerald-500',
                    'warning': 'bg-amber-500 animate-pulse',
                    'down': 'bg-red-500 animate-pulse'
                };

                const logoUrl = getLogoUrl(service.domain);

                const maxHist = Math.max(...service.history);
                const sparklineHTML = service.history.slice(12, 24).map(val => {
                    const height = Math.max(10, (val / maxHist) * 100);
                    const barColor = service.status === 'down' ? 'bg-red-500' : (service.status === 'warning' ? 'bg-amber-400' : 'bg-gray-300 dark:bg-gray-600');
                    return `<div class="w-1.5 rounded-t-sm sparkline-bar ${barColor} opacity-80" style="height: ${height}%"></div>`;
                }).join('');

                let statusSubtext = `<span class="text-emerald-600 dark:text-emerald-400 font-medium">✓ פועל כסדר</span>`;
                if (service.status !== 'ok') {
                    statusSubtext = `<span class="text-red-600 dark:text-red-400 font-bold">⚠️ תקלה מרכזית: ${service.primaryIssue}</span>`;
                }

                let extraBorder = service.id === 'jumbomail' ? 'border border-blue-500/30 dark:border-blue-500/50 shadow-md shadow-blue-500/10' : 'border border-gray-100 dark:border-gray-800 shadow-sm';
                let recommendedTag = service.id === 'jumbomail' ? `<div class="absolute -top-3 -right-3 bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded-bl-xl rounded-tr-xl shadow-md transform rotate-3">מומלץ</div>` : '';

                if(service.isCustom) extraBorder = 'border border-purple-500/30 shadow-md shadow-purple-500/10';

                const card = document.createElement('div');
                card.className = `bg-white dark:bg-dd-card rounded-2xl p-5 ${extraBorder} cursor-pointer hover:shadow-lg transition-all duration-300 transform hover:-translate-y-1 relative h-48 flex flex-col justify-between group`;
                card.onclick = () => openModal(service.id);
                
                card.innerHTML = `
                    ${recommendedTag}
                    <div class="flex justify-between items-start mb-3">
                        <div class="px-2.5 py-1 rounded-full text-xs font-semibold flex items-center gap-1.5 border ${colorMap[service.status]}">
                            <span class="w-2 h-2 rounded-full ${dotColorMap[service.status]}"></span>
                            ${service.statusText}
                        </div>
                        <div class="w-14 h-14 bg-white rounded-xl shadow-sm border border-gray-100 flex items-center justify-center p-1.5 shrink-0 overflow-hidden group-hover:scale-110 transition-transform duration-300 relative">
                            <img src="${logoUrl}" alt="${service.name}" class="w-full h-full object-contain" onerror="handleImgError(this, '${service.name.replace(/'/g, "\\'")}')">
                        </div>
                    </div>
                    <div>
                        <h3 class="font-bold text-gray-900 dark:text-white text-[1.1rem] leading-tight truncate mb-1" title="${service.name}">${service.name}</h3>
                        <p class="text-[11px] truncate mt-0.5" dir="ltr" style="text-align: right;">${service.isCustom ? '<span class="text-gray-400">'+service.domain+'</span>' : statusSubtext}</p>
                    </div>
                    <div class="h-10 mt-3 flex items-end justify-between gap-1 w-full border-t border-gray-50 dark:border-gray-800 pt-3">
                        ${sparklineHTML}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Custom Server Addition Logic
        window.openAddServerModal = function() {
            const modal = document.getElementById('addServerModal');
            modal.classList.remove('hidden');
            setTimeout(() => { 
                modal.classList.remove('opacity-0'); 
                document.getElementById('addServerModalContent').classList.remove('scale-95'); 
            }, 10);
        }

        window.saveCustomServer = function() {
            const name = document.getElementById('customServerName').value.trim();
            const address = document.getElementById('customServerAddress').value.trim();
            
            if (!name || !address) {
                alert('אנא הזן שם שרת וכתובת IP / URL תקינה');
                return;
            }
            
            const newId = 'custom-' + Date.now();
            
            const newService = {
                id: newId, 
                name: name, 
                category: 'custom', 
                domain: address, // Store IP/URL as domain
                status: 'ok', 
                statusText: 'מנוטר (חי)', 
                statusColor: 'green',
                history: Array.from({length: 24}, () => Math.floor(Math.random() * 5) + 1), // Low steady ping history
                primaryIssue: 'זמן תגובה (Ping)', 
                impactLocation: 'רשת מקומית / מותאמת', 
                rootCause: null, 
                isGlobal: false,
                isCustom: true
            };
            
            servicesData.unshift(newService);
            
            closeModal('addServerModal');
            document.getElementById('searchInput').value = '';
            
            // Switch to custom tab to show the new addition
            filterCategory('custom');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => renderServices(currentFilter, e.target.value));

        window.filterCategory = function(cat) {
            currentFilter = cat;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-blue-600', 'text-white', 'border-blue-600', 'bg-purple-600', 'border-purple-600');
                if (cat === 'down' && btn.innerHTML.includes('תקלות')) {
                     // Keep base style
                } else if (cat === 'custom' && btn.innerHTML.includes('שרתים אישיים')) {
                    btn.classList.add('active', 'bg-purple-600', 'text-white', 'border-purple-600');
                    btn.classList.remove('bg-purple-50', 'dark:bg-purple-900/20', 'text-purple-700', 'dark:text-purple-300');
                } else if (btn.getAttribute('onclick').includes(`('${cat}')`)) {
                    btn.classList.add('active', 'bg-blue-600', 'text-white', 'border-blue-600');
                    btn.classList.remove('bg-white', 'dark:bg-dd-card', 'text-gray-900', 'dark:text-white');
                } else {
                    if(btn.innerHTML.includes('שרתים אישיים')) {
                        btn.classList.add('bg-purple-50', 'dark:bg-purple-900/20', 'text-purple-700', 'dark:text-purple-300');
                    } else if(!btn.innerHTML.includes('תקלות')) {
                        btn.classList.add('bg-white', 'dark:bg-dd-card', 'text-gray-900', 'dark:text-white');
                    }
                }
            });
            renderServices(cat, document.getElementById('searchInput').value);
        }

        // Main Service Modal Logic
        window.openModal = function(id) {
            const service = servicesData.find(s => s.id === id);
            if (!service) return;

            document.getElementById('modalTitle').innerText = service.name;
            const logoUrl = getLogoUrl(service.domain);
            document.getElementById('modalIconContainer').innerHTML = `<img src="${logoUrl}" alt="${service.name}" class="w-full h-full object-contain" onerror="handleImgError(this, '${service.name.replace(/'/g, "\\'")}')">`;
            
            const badge = document.getElementById('modalStatusBadge');
            const statusText = document.getElementById('modalStatusText');
            const dot = badge.querySelector('span');
            
            badge.className = 'inline-flex items-center px-4 py-1.5 rounded-full text-sm font-bold gap-2 mt-2';
            
            if (service.status === 'ok') {
                badge.classList.add('bg-emerald-100', 'text-emerald-700', 'dark:bg-emerald-900/30', 'dark:text-emerald-400');
                dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500';
            } else if (service.status === 'warning') {
                badge.classList.add('bg-amber-100', 'text-amber-700', 'dark:bg-amber-900/30', 'dark:text-amber-400');
                dot.className = 'w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse';
            } else {
                badge.classList.add('bg-red-100', 'text-red-700', 'dark:bg-red-900/30', 'dark:text-red-400');
                dot.className = 'w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse';
            }
            statusText.innerText = service.statusText;

            const locTextEl = document.getElementById('modalLocationText');
            const locValueEl = document.getElementById('modalLocationValue');
            const causeTextEl = document.getElementById('modalRootCauseText');
            const causeValueEl = document.getElementById('modalRootCauseValue');

            if (service.status !== 'ok') {
                locValueEl.innerText = service.impactLocation;
                locTextEl.classList.remove('hidden');
                locTextEl.className = service.status === 'down' 
                    ? 'mt-3 text-sm font-semibold text-red-500 dark:text-red-400 flex items-center gap-2' 
                    : 'mt-3 text-sm font-medium text-amber-500 dark:text-amber-400 flex items-center gap-2';
                
                causeValueEl.innerText = service.rootCause;
                causeTextEl.classList.remove('hidden');
            } else {
                locTextEl.classList.add('hidden');
                causeTextEl.classList.add('hidden');
            }

            const problemsDiv = document.getElementById('modalProblems');
            problemsDiv.innerHTML = '';
            let p1, p2, p3;
            if (service.status === 'down') { p1 = 65; p2 = 25; p3 = 10; }
            else if (service.status === 'warning') { p1 = 45; p2 = 35; p3 = 20; }
            else { p1 = 40; p2 = 30; p3 = 30; }

            const issues = {
                israel: ["אתר אינטרנט", "אפליקציה בנייד", "התחברות לחשבון"],
                finance: ["התחברות לחשבון", "העברת כספים", "אפליקציה"],
                telecom: ["אינטרנט ביתי", "קליטה סלולרית", "ניתוקים"],
                ai: ["חיבור לשרת", "יצירת תוכן", "התחברות"],
                social: ["שליחת הודעות", "טעינת פיד", "אפליקציה"],
                shopping: ["תשלום/סליקה", "עגלת קניות", "אתר אינטרנט"],
                gaming: ["חיבור לשרת", "מולטיפלייר", "לאג/תקיעות"],
                custom: ["Time Out (פינג)", "חיבור נדחה (Connection Refused)", "נפילת שרת ווב"]
            };
            let probs = issues[service.category] || issues['israel'];

            [{ name: probs[0], val: p1 }, { name: probs[1], val: p2 }, { name: probs[2], val: p3 }].forEach(p => {
                problemsDiv.innerHTML += `
                    <div class="flex items-center gap-3">
                        <div class="w-12 text-sm font-medium text-gray-500 dark:text-gray-400">${p.val}%</div>
                        <div class="flex-1 bg-gray-200 dark:bg-gray-700 rounded-full h-3 overflow-hidden">
                            <div class="bg-blue-500 h-3 rounded-full" style="width: ${p.val}%"></div>
                        </div>
                        <div class="w-32 text-sm text-gray-700 dark:text-gray-300">${p.name}</div>
                    </div>`;
            });

            const ctx = document.getElementById('modalChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();
            const isDark = isDarkMode();
            const gridColor = isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)';
            const textColor = isDark ? '#9ca3af' : '#4b5563';
            const lineColor = service.status === 'down' ? '#ef4444' : (service.status === 'warning' ? '#f59e0b' : '#3b82f6');
            const bgColor = service.status === 'down' ? 'rgba(239, 68, 68, 0.2)' : (service.status === 'warning' ? 'rgba(245, 158, 11, 0.2)' : 'rgba(59, 130, 246, 0.2)');

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array.from({length: 24}, (_, i) => `${i}:00`),
                    datasets: [{
                        label: service.isCustom ? 'מילי-שניות (ms)' : 'דיווחי תקלות', data: service.history,
                        borderColor: lineColor, backgroundColor: bgColor,
                        borderWidth: 3, pointRadius: 0, pointHoverRadius: 6, fill: true, tension: 0.4
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } },
                    scales: {
                        x: { grid: { display: false, color: gridColor }, ticks: { maxTicksLimit: 8, color: textColor } },
                        y: { grid: { color: gridColor }, border: { dash: [4, 4] }, ticks: { color: textColor, beginAtZero: true } }
                    },
                    interaction: { mode: 'nearest', axis: 'x', intersect: false }
                }
            });

            document.getElementById('reportSuccessMsg').classList.add('hidden');
            openModalAnimation('serviceModal');
        }

        window.openModalAnimation = function(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.remove('hidden');
            setTimeout(() => { 
                modal.classList.remove('opacity-0'); 
                const content = modal.querySelector('div[id$="Content"]');
                if(content) content.classList.remove('scale-95'); 
            }, 10);
        }

        window.closeModal = function(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.add('opacity-0');
            const content = modal.querySelector('div[id$="Content"]');
            if(content) content.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        window.reportIssue = function() {
            document.getElementById('reportSuccessMsg').classList.remove('hidden');
            if(chartInstance) {
                const data = chartInstance.data.datasets[0].data;
                data[data.length-1] += 15; chartInstance.update();
            }
        }

        function updateChartTheme() {
            if (chartInstance) {
                const isDark = isDarkMode();
                chartInstance.options.scales.x.grid.color = isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)';
                chartInstance.options.scales.y.grid.color = isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)';
                chartInstance.options.scales.x.ticks.color = isDark ? '#9ca3af' : '#4b5563';
                chartInstance.options.scales.y.ticks.color = isDark ? '#9ca3af' : '#4b5563';
                chartInstance.update();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
            renderServices(); filterCategory('all');
        });
        
        // Close modals on click outside
        document.querySelectorAll('.modal-overlay').forEach(modal => {
            modal.addEventListener('click', function(e) { 
                if (e.target === this) closeModal(this.id); 
            });
        });
    </script>
</body>
</html>
